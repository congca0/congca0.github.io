# Site settings
title: "Cong Cao"
description: "Postdoctoral Scholar at Stanford University"
url: "https://congca0.github.io"
baseurl: ""

# Site author
author:
  name: ""
  avatar: "/images/profile.jpg"
  bio: "Postdoctoral Scholar, Stanford University"
  location: "Palo Alto, California"
  employer: "Stanford University"
  email: "congc@stanford.edu"
  github: "congca0"
  googlescholar: "KoFMlFQAAAAJ"
  orcid: "0000-0001-8289-1705"
  linkedin: "cong-cao-70068839b"

# Theme
minimal_mistakes_skin: "air"

# Build settings
markdown: kramdown
permalink: /:categories/:title/

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Plugins
plugins:
  - jekyll-include-cache

# Include
include:
  - _pages

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
