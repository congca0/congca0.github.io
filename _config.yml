 # Site settings
title: "Cong Cao"
name: "Cong Cao"
description: "Research Fellow at Stanford University"
url: "https://congcao.github.io"
baseurl: ""

# Site author
author:
  name: "Cong Cao"
  avatar: "/images/profile.png"
  bio: "Research Fellow, Department of Surgery, Stanford University"
  location: "Stanford, California"
  employer: "Stanford University"

# Theme
minimal_mistakes_skin: "default"

# Build settings
markdown: kramdown
permalink: /:categories/:title/

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Plugins
plugins:
  - jekyll-include-cache

# Include
include:
  - _pages

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
